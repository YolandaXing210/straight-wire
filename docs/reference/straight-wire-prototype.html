<title>Straight Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: slim toolbar on top, a framed Grasshopper canvas filling the screen, status strip below. */
:root {
  --chrome: #e5e3dc; --raise: #f5f4f0; --fg: #1c1d1f; --muted: #6a675f; --line: #c4c1b8;
  --accent: #4a8519; --accent-ink: #fbfdf7; --shadow-ui: rgba(40,36,28,.18);
  --cv-bg: #d3d0c7; --cv-grid: #c8c5bb;
  --node: #f2f1ec; --node-strip: #d3d1ca; --node-edge: #2a2b2d; --node-text: #18191b;
  --wire: rgba(28,29,31,.86); --sel: #4f9418; --sel-fill: #c3e39b;
  --panel: #fbf18a; --panel-edge: #8b812c; --panel-text: #2a2810;
  --slider-track: #8a877f; --channel: rgba(79,148,24,.14); --shadow: rgba(40,36,28,.22);
  --f-ui: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-node: "IBM Plex Sans Condensed", "Arial Narrow", "PingFang SC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #18191b; --raise: #232528; --fg: #e8e6e0; --muted: #9d9a92; --line: #34363a;
    --accent: #94d058; --accent-ink: #13200a; --shadow-ui: rgba(0,0,0,.4);
    --cv-bg: #2a2c2f; --cv-grid: #323539;
    --node: #45484d; --node-strip: #35383c; --node-edge: #0f1011; --node-text: #eeede8;
    --wire: rgba(228,226,219,.8); --sel: #9ad85e; --sel-fill: #56763a;
    --panel: #d8ce55; --panel-edge: #6c661f; --panel-text: #23210b;
    --slider-track: #8f8d86; --channel: rgba(154,216,94,.12); --shadow: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #18191b; --raise: #232528; --fg: #e8e6e0; --muted: #9d9a92; --line: #34363a;
  --accent: #94d058; --accent-ink: #13200a; --shadow-ui: rgba(0,0,0,.4);
  --cv-bg: #2a2c2f; --cv-grid: #323539;
  --node: #45484d; --node-strip: #35383c; --node-edge: #0f1011; --node-text: #eeede8;
  --wire: rgba(228,226,219,.8); --sel: #9ad85e; --sel-fill: #56763a;
  --panel: #d8ce55; --panel-edge: #6c661f; --panel-text: #23210b;
  --slider-track: #8f8d86; --channel: rgba(154,216,94,.12); --shadow: rgba(0,0,0,.5);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { height: 100%; background: var(--chrome); color: var(--fg); font: 14px/1.4 var(--f-ui); overflow: hidden; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding-inline: 16px; padding-block: 10px 8px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font-weight: 600; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

kbd { font: 500 10.5px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; }

.styler { display: inline-flex; align-items: center; gap: 8px; }
.scope { font: 500 11.5px var(--f-ui); color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.scope.on { color: var(--accent); border: 1px solid var(--accent); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--fg); font: 500 13px var(--f-ui); padding: 5px 9px; border-radius: 5px; cursor: pointer; }
.seg button svg { width: 16px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.seg button:hover { background: var(--chrome); }
.seg button[aria-checked="true"] { background: var(--fg); color: var(--raise); }
.seg button[aria-checked="true"] kbd { color: inherit; border-color: currentColor; opacity: .55; }

.ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.ctl input { width: 88px; accent-color: var(--accent); }
.ctl output { font: 500 12px var(--f-mono); min-width: 2ch; color: var(--muted); font-variant-numeric: tabular-nums; }

.sw { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; position: relative; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw .track { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .15s; }
.sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--raise); box-shadow: 0 1px 2px var(--shadow-ui); transition: transform .15s; }
.sw input:checked + .track { background: var(--accent); }
.sw input:checked + .track::after { transform: translateX(12px); }

.acts { display: inline-flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 7px; font: 500 13px var(--f-ui); color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary kbd { color: inherit; border-color: currentColor; opacity: .6; }

button:focus-visible, .sw input:focus-visible + .track, .ctl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { position: relative; flex: 1; min-height: 240px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--cv-bg); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.demo { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; align-items: center; }
.demo span, .demo button { font: 12px/1.5 var(--f-ui); color: var(--muted); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.demo button { color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.demo button:hover { border-color: var(--muted); }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -6px); opacity: 0; transition: opacity .18s, transform .18s; background: var(--fg); color: var(--raise); padding: 6px 12px; border-radius: 6px; font-size: 13px; pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--raise); }
.zoom button { width: 30px; height: 28px; border: 0; background: transparent; color: var(--fg); font: 500 16px/1 var(--f-ui); cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--chrome); }
.selbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 12px; box-shadow: 0 4px 14px var(--shadow-ui); max-width: calc(100% - 100px); }
.selbar span { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; min-width: 0; font-variant-numeric: tabular-nums; }
.selbar button { font: 500 12.5px var(--f-ui); color: var(--fg); background: transparent; border: 0; border-radius: 5px; padding: 4px 8px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.selbar button:hover { background: var(--chrome); }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 12px; color: var(--muted); }
.hints { margin-right: auto; min-width: 0; }
.legend { display: inline-flex; gap: 14px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { fill: none; stroke: var(--fg); stroke-width: 1.2; }
.count { font: 500 12px var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  .brand span, .hints, .bar kbd, .selbar kbd, .demo span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .sw .track, .sw .track::after { transition: none; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><b>Straight Wire</b><span>Grasshopper 直线走线插件 · 手感原型</span></div>
    <div class="styler">
      <span class="scope" id="scope" title="1 / 2 / 3 作用的范围：没有选中时改全部，有选中时只改所选">全部</span>
      <div class="seg" role="radiogroup" aria-label="走线样式">
        <button type="button" role="radio" aria-checked="true" data-mode="bezier" id="m-bezier"><svg viewBox="0 0 16 14" aria-hidden="true"><path d="M1 11C8 11 8 3 15 3"/></svg>曲线<kbd>1</kbd></button>
        <button type="button" role="radio" aria-checked="false" data-mode="ortho" id="m-ortho"><svg viewBox="0 0 16 14" aria-hidden="true"><path d="M1 11H8V3H15"/></svg>直角<kbd>2</kbd></button>
        <button type="button" role="radio" aria-checked="false" data-mode="diag" id="m-diag"><svg viewBox="0 0 16 14" aria-hidden="true"><path d="M1 11H5L13 3H15"/></svg>45°<kbd>3</kbd></button>
      </div>
    </div>
    <label class="ctl" for="sp">线距<input type="range" id="sp" min="6" max="20" step="1" value="10"><output id="spv" for="sp">10</output></label>
    <label class="sw" for="snap"><input type="checkbox" id="snap" checked><span class="track" aria-hidden="true"></span>吸附</label>
    <div class="acts">
      <button type="button" class="btn primary" id="tidy"><span id="tidyLabel">整理全部</span><kbd>T</kbd></button>
      <button type="button" class="btn" id="fitb">适配<kbd>F</kbd></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Grasshopper 画布模拟，可选中、拖动电池和走线"></canvas>
    <div class="demo"><span>示例定义 · 扭转塔楼</span><button type="button" id="scramble">打乱示例<kbd>R</kbd></button></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="selbar" id="selbar" hidden>
      <span id="selinfo"></span>
      <button type="button" id="selreset">复位走线<kbd>Del</kbd></button>
      <button type="button" id="selclear">取消选择<kbd>Esc</kbd></button>
    </div>
    <div class="zoom"><button type="button" id="zin" aria-label="放大">+</button><button type="button" id="zout" aria-label="缩小">−</button></div>
  </main>

  <footer class="foot">
    <span class="hints">左键拖空白框选 · 右键或空格拖动平移 · 拖拐点改形状（按住 Alt 不吸附）· 双击线加点，双击点删点</span>
    <span class="legend">
      <span><svg width="22" height="8" aria-hidden="true"><path d="M1 4H21"/></svg>单值</span>
      <span><svg width="22" height="8" aria-hidden="true"><path d="M1 2.5H21M1 5.5H21"/></svg>列表</span>
      <span><svg width="22" height="8" aria-hidden="true"><path d="M1 2.5H21M1 5.5H21" stroke-dasharray="3 2"/></svg>树</span>
    </span>
    <span class="count" id="count">直连 0 / 18</span>
  </footer>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const toastEl = $('toast'), countEl = $('count'), scopeEl = $('scope'), tidyLabel = $('tidyLabel');
  const selbar = $('selbar'), selInfo = $('selinfo');
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // World units are Grasshopper canvas pixels at 100% zoom.
  const ROW = 20, STUB = 18, CH = 14, DSTUB = 6, GRID = 10, CLR = 8, VG = 12, MDUR = 420, STAG = 240;
  const NAMES = { bezier: '曲线', ortho: '直角', diag: '45°' };
  const MODE_MSG = { bezier: '全部走线：Grasshopper 原生曲线', ortho: '全部走线：直角，按通道排开', diag: '全部走线：45°，没有遮挡时只拐两次' };
  let SP = 10, globalMode = 'bezier', snapOn = true;
  const selN = new Set(), selW = new Set();
  let hoverW = null, drag = null, guides = [], spaceDown = false, lastMend = -1e9;
  const view = { s: 1, ox: 0, oy: 0 };
  let viewAnim = null, W = 1, H = 1, DPR = 1, fitted = false, lastCount = -1;
  let C = {}, F = {};

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function readTokens() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    C = {
      bg: g('--cv-bg'), grid: g('--cv-grid'), node: g('--node'), strip: g('--node-strip'), edge: g('--node-edge'),
      text: g('--node-text'), wire: g('--wire'), sel: g('--sel'), selFill: g('--sel-fill'), panel: g('--panel'),
      panelEdge: g('--panel-edge'), panelText: g('--panel-text'), track: g('--slider-track'), channel: g('--channel'), shadow: g('--shadow')
    };
    F = { node: g('--f-node'), mono: g('--f-mono') };
  }

  // ---------- the example definition: a twisted tower ----------
  const DEF = [
    { id: 'floors', kind: 'slider', name: 'Floors', min: 2, max: 60, value: 24, dec: 0, x: 40, y: 60 },
    { id: 'fh', kind: 'slider', name: 'Floor H', min: 2.5, max: 5, value: 3.2, dec: 2, x: 70, y: 150 },
    { id: 'radius', kind: 'slider', name: 'Radius', min: 4, max: 30, value: 12, dec: 1, x: 20, y: 410 },
    { id: 'sides', kind: 'slider', name: 'Sides', min: 3, max: 12, value: 6, dec: 0, x: 80, y: 480 },
    { id: 'twist', kind: 'slider', name: 'Twist', min: 0, max: 0.1, value: 0.02, dec: 3, x: 330, y: 575 },
    { id: 'div', kind: 'slider', name: 'Divisions', min: 4, max: 40, value: 16, dec: 0, x: 560, y: 20 },
    { id: 'series', kind: 'comp', name: 'Series', ins: ['S', 'N', 'C'], outs: ['S'], x: 330, y: 80 },
    { id: 'unitz', kind: 'comp', name: 'Z', ins: ['F'], outs: ['V'], x: 500, y: 250 },
    { id: 'poly', kind: 'comp', name: 'Polygon', ins: ['P', 'R', 'S'], outs: ['P'], x: 300, y: 330 },
    { id: 'mult', kind: 'comp', name: 'A×B', ins: ['A', 'B'], outs: ['R'], x: 590, y: 420 },
    { id: 'move', kind: 'comp', name: 'Move', ins: ['G', 'T'], outs: ['G', 'X'], x: 660, y: 190 },
    { id: 'rot', kind: 'comp', name: 'Rotate', ins: ['G', 'A', 'P'], outs: ['G', 'X'], x: 790, y: 330 },
    { id: 'loft', kind: 'comp', name: 'Loft', ins: ['C', 'O'], outs: ['L'], x: 960, y: 200 },
    { id: 'divc', kind: 'comp', name: 'Divide', ins: ['C', 'N', 'K'], outs: ['P', 'T', 't'], x: 900, y: 450 },
    { id: 'flip', kind: 'comp', name: 'Flip', ins: ['D'], outs: ['D'], x: 1080, y: 480 },
    { id: 'intc', kind: 'comp', name: 'IntCrv', ins: ['V', 'D', 'P', 'K'], outs: ['C', 'L', 'D'], x: 960, y: 600 },
    { id: 'area', kind: 'comp', name: 'Area', ins: ['G'], outs: ['A', 'C'], x: 1110, y: 150 },
    { id: 'panel', kind: 'panel', name: 'Panel', x: 1250, y: 110 }
  ];
  const WDEF = [
    ['floors', 0, 'series', 2, 'item'], ['fh', 0, 'series', 1, 'item'],
    ['series', 0, 'unitz', 0, 'list'], ['series', 0, 'mult', 0, 'list'], ['twist', 0, 'mult', 1, 'item'],
    ['radius', 0, 'poly', 1, 'item'], ['sides', 0, 'poly', 2, 'item'],
    ['poly', 0, 'move', 0, 'item'], ['unitz', 0, 'move', 1, 'list'],
    ['move', 0, 'rot', 0, 'list'], ['mult', 0, 'rot', 1, 'list'],
    ['rot', 0, 'loft', 0, 'list'], ['rot', 0, 'divc', 0, 'list'], ['div', 0, 'divc', 1, 'item'],
    ['divc', 0, 'flip', 0, 'tree'], ['flip', 0, 'intc', 0, 'tree'],
    ['loft', 0, 'area', 0, 'item'], ['area', 0, 'panel', 0, 'item']
  ];

  function sizeNode(n) {
    if (n.kind === 'slider') { n.w = 200; n.h = 20; return; }
    if (n.kind === 'panel') { n.w = 130; n.h = 56; return; }
    const rows = Math.max(n.ins.length, n.outs.length, 1);
    const nameH = Math.ceil((n.name.length * 6.4 + 14) / ROW) * ROW;
    n.h = Math.max(rows * ROW, nameH, 2 * ROW);
    const col = list => Math.max(...list.map(s => s.length)) * 6.5 + 12;
    n.iw = col(n.ins); n.ow = col(n.outs);
    n.w = Math.round(n.iw + 20 + n.ow);
  }

  const nodes = DEF.map((d, i) => { const n = Object.assign({}, d, { idx: i, hx: d.x, hy: d.y, vx: 0, vy: 0, tx: null, ty: null, wait: 0 }); sizeNode(n); return n; });
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const wires = WDEF.map(([a, ai, b, bi, type], i) => ({
    idx: i, a: byId[a], ai, b: byId[b], bi, type,
    ovr: null, pts: null, snap: null, mend: -1e9,
    f: null, fv: 0, manual: null, pin: false,
    dg: null, dgv: 0, dgt: 0, xo: 0, xov: 0, xt: 0, flash: -1e9
  }));
  const order = nodes.slice();
  function toFront(n) { const i = order.indexOf(n); if (i >= 0) { order.splice(i, 1); order.push(n); } }

  const nIn = n => n.kind === 'comp' ? n.ins.length : 1;
  const nOut = n => n.kind === 'comp' ? n.outs.length : 1;
  const inOff = (n, i) => n.h * (i + 0.5) / nIn(n);
  const outOff = (n, j) => n.h * (j + 0.5) / nOut(n);
  const portName = (n, j, out) => n.kind === 'comp' ? (out ? n.outs[j] : n.ins[j]) : '';
  const wireLabel = w => {
    const a = portName(w.a, w.ai, true), b = portName(w.b, w.bi, false);
    return `${w.a.name}${a ? '.' + a : ''} → ${w.b.name}${b ? '.' + b : ''}`;
  };

  // Each wire follows the global style unless the user gave it its own.
  const styleOf = w => w.ovr || globalMode;
  const isTrace = w => styleOf(w) !== 'bezier';
  const editable = w => isTrace(w) && !w.snap;

  // ---------- geometry helpers ----------
  function segDist(p, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    const t = l2 ? clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2, 0, 1) : 0;
    return Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t);
  }
  function polyDist(p, P) { let m = Infinity; for (let i = 0; i < P.length - 1; i++) m = Math.min(m, segDist(p, P[i], P[i + 1])); return m; }
  const orient = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  function segSegDist(p1, p2, q1, q2) {
    const d1 = orient(q1, q2, p1), d2 = orient(q1, q2, p2), d3 = orient(p1, p2, q1), d4 = orient(p1, p2, q2);
    if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return 0;
    return Math.min(segDist(p1, q1, q2), segDist(p2, q1, q2), segDist(q1, p1, p2), segDist(q2, p1, p2));
  }
  function polyPolyDist(P, Q, lim) {
    let m = Infinity;
    for (let i = 0; i < P.length - 1; i++) for (let j = 0; j < Q.length - 1; j++) {
      const d = segSegDist(P[i], P[i + 1], Q[j], Q[j + 1]);
      if (d < m) { m = d; if (m < lim) return m; }
    }
    return m;
  }
  function segRectHit(a, b, r) {
    let t0 = 0, t1 = 1;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const p = [-dx, dx, -dy, dy], q = [a[0] - r.x0, r.x1 - a[0], a[1] - r.y0, r.y1 - a[1]];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
      else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
    return true;
  }

    const ncol = cols.filter(c => c.length).length;
    if (!scope) fit(true, true);
    toast(scope ? `整理所选：${N.length} 个电池排成 ${ncol} 列，其余不动` : `整理全部：按数据流排成 ${ncol} 列，端口对齐`);
    kick();
  }
  function scramble() {
    if (drag) endDrag();
    const now = performance.now();
    for (const n of nodes) {
      n.tx = Math.round((n.hx + (Math.random() - 0.5) * 80) / GRID) * GRID;
      n.ty = Math.round((n.hy + (Math.random() - 0.5) * 80) / GRID) * GRID;
      n.wait = now + (RM ? 0 : Math.random() * 160);
    }
    snapshot(wires.filter(w => w.pts), false);
    for (const w of wires) { w.manual = null; w.lane = null; w.pts = null; }
    fit(true, true);
    toast('示例已打乱，按 T 整理');
  }

  // ---------- pointer ----------
  const pointers = new Map();
  const rel = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const toWorld = s => [(s.x - view.ox) / view.s, (s.y - view.oy) / view.s];
  function hitNode(p) {
    for (let i = order.length - 1; i >= 0; i--) {
      const n = order[i];
      if (p[0] >= n.x - 4 && p[0] <= n.x + n.w + 4 && p[1] >= n.y && p[1] <= n.y + n.h) return n;
    }
    return null;
  }
  function onTrack(n, p) { if (n.kind !== 'slider') return false; const { t0, t1 } = trackOf(n); return p[0] >= t0 - 8 && p[0] <= t1 + 8; }
  function hitHandle(p) {
    const r = 7 / view.s, cands = [...selW];
    if (hoverW) cands.unshift(hoverW);
    for (const w of cands) {
      if (!editable(w) || !w.disp) continue;
      const P = w.disp;
      for (let i = 1; i < P.length - 1; i++) if (Math.abs(p[0] - P[i][0]) <= r && Math.abs(p[1] - P[i][1]) <= r) return { w, i: i - 1 };
    }
    return null;
  }
  function hitWire(p) {
    let best = null, bd = 6 / view.s;
    for (const w of wires) {
      const P = w.disp;
      if (!P) continue;
      for (let i = 0; i < P.length - 1; i++) { const d = segDist(p, P[i], P[i + 1]); if (d < bd) { bd = d; best = { w, seg: i }; } }
    }
    return best;
  }
  // What dragging this part of a wire does: slide its lane, or move a custom segment.
  function segAction(hit) {
    const w = hit.w, P = w.disp;
    if (!editable(w)) return null;
    if (w.kind === 'lane' && hit.seg >= 1 && hit.seg <= P.length - 3) return 'lane';
    if (w.kind === 'manual' && P.length > 2) return 'seg';
    return null;
  }
  function ensureManual(w) {
    if (w.pts) return;
    w.pts = w.disp.slice(1, -1).map(p => [p[0], p[1]]);
    w.manual = null; w.pin = false;
  }
  // Port-to-port magnet: within a few pixels, the wire snaps dead straight.
  function magnetY(n, rawY, gset, nx) {
    const thr = 9 / view.s;
    let best = null;
    for (const w of wires) {
      if (w.pts) continue;
      let y = null;
      if (w.b === n && !gset.has(w.a) && w.a.x + w.a.w < nx - 8) y = w.a.y + outOff(w.a, w.ai) - inOff(n, w.bi);
      else if (w.a === n && !gset.has(w.b) && nx + n.w < w.b.x - 8) y = w.b.y + inOff(w.b, w.bi) - outOff(n, w.ai);
      if (y == null) continue;
      const d = Math.abs(y - rawY);
      if (d < thr && (!best || d < best.d)) best = { y, d, w };
    }
    return best;
  }
  // Point snap: neighbours pull the point onto 0° / 45° / 90° lines; otherwise the grid.
  const DIRS = [[1, 0], [0, 1], [Math.SQRT1_2, Math.SQRT1_2], [Math.SQRT1_2, -Math.SQRT1_2]];
  function snapPoint(raw, A, B, free) {
    if (free) return { p: raw, guides: [] };
    const thr = 8 / view.s, lines = [];
    for (const O of [A, B]) for (const d of DIRS) {
      const t = (raw[0] - O[0]) * d[0] + (raw[1] - O[1]) * d[1];
      const q = [O[0] + d[0] * t, O[1] + d[1] * t];
      const dist = Math.hypot(raw[0] - q[0], raw[1] - q[1]);
      if (dist < thr) lines.push({ O, d, q, dist });
    }
    let best = null;
    for (const la of lines) for (const lb of lines) {
      if (la.O !== A || lb.O !== B) continue;
      const den = la.d[0] * lb.d[1] - la.d[1] * lb.d[0];
      if (Math.abs(den) < 1e-6) continue;
      const t = ((lb.O[0] - la.O[0]) * lb.d[1] - (lb.O[1] - la.O[1]) * lb.d[0]) / den;
      const X = [la.O[0] + la.d[0] * t, la.O[1] + la.d[1] * t];
      const dist = Math.hypot(X[0] - raw[0], X[1] - raw[1]);
      if (dist < thr * 1.5 && (!best || dist < best.dist)) best = { p: X, dist, ls: [la, lb] };
    }
    if (best) return { p: best.p, guides: best.ls.map(l => [l.O, best.p]) };
    if (lines.length) { lines.sort((p, q) => p.dist - q.dist); const l = lines[0]; return { p: l.q, guides: [[l.O, l.q]] }; }
    return { p: [Math.round(raw[0] / GRID) * GRID, Math.round(raw[1] / GRID) * GRID], guides: [] };
  }
  function setCursor() {
    if (!drag) { cv.style.cursor = spaceDown ? 'grab' : 'default'; return; }
    cv.style.cursor = { lane: 'col-resize', slider: 'ew-resize', point: 'move', seg: 'move', marquee: 'crosshair' }[drag.type] || 'grabbing';
  }
  function updateHover(sp) {
    const wp = toWorld(sp);
    let cur = 'default', hw = null;
    const hh = hitHandle(wp);
    if (hh) { hw = hh.w; cur = 'move'; }
    else {
      const n = hitNode(wp);
      if (n) cur = onTrack(n, wp) ? 'ew-resize' : 'grab';
      else {
        const hit = hitWire(wp);
        if (hit) { hw = hit.w; const act = segAction(hit); cur = act === 'lane' ? 'col-resize' : act === 'seg' ? 'move' : 'pointer'; }
      }
    }
    cv.style.cursor = spaceDown ? 'grab' : cur;
    if (hw !== hoverW) { hoverW = hw; kick(); }
  }
  function setSlider(n, wx) {
    const { t0, t1 } = trackOf(n), k = Math.pow(10, n.dec);
    n.value = Math.round((n.min + clamp((wx - t0) / (t1 - t0), 0, 1) * (n.max - n.min)) * k) / k;
  }
  function startNodeDrag(n, wp) {
    const gset = new Set(selN);
    const group = [...gset].map(m => ({ n: m, x0: m.x, y0: m.y }));
    for (const g of group) { g.n.tx = g.n.ty = null; g.n.vx = g.n.vy = 0; }
    const carried = wires.filter(w => w.pts && gset.has(w.a) && gset.has(w.b)).map(w => ({ w, pts: w.pts.map(p => p.slice()) }));
    drag = { type: 'node', n, gset, group, carried, gx: n.x, gy: n.y, dx: wp[0] - n.x, dy: wp[1] - n.y, aligned: null };
  }
  function moveNodes(wp, free) {
    const d = drag, n = d.n;
    const rx = wp[0] - d.dx, ry = wp[1] - d.dy;
    const nx = free ? rx : Math.round(rx / GRID) * GRID;
    const m = free ? null : magnetY(n, ry, d.gset, nx);
    const ny = m ? m.y : free ? ry : Math.round(ry / GRID) * GRID;
    const ddx = nx - d.gx, ddy = ny - d.gy;
    for (const g of d.group) { g.n.x = g.x0 + ddx; g.n.y = g.y0 + ddy; }
    for (const c of d.carried) c.w.pts = c.pts.map(p => [p[0] + ddx, p[1] + ddy]);
    if (m && m.w !== d.aligned) toast(`${wireLabel(m.w)} 已拉直`);
    d.aligned = m ? m.w : null;
    guides = m ? [{ wire: m.w }] : [];
  }
  function movePoint(wp, free) {
    const w = drag.w, i = drag.i;
    const A = i === 0 ? [w.ax, w.ay] : w.pts[i - 1];
    const B = i === w.pts.length - 1 ? [w.bx, w.by] : w.pts[i + 1];
    const r = snapPoint(wp, A, B, free);
    w.pts[i] = r.p; guides = r.guides;
  }
  // Dragging a custom segment slides it sideways; its neighbours stretch to follow.
  function moveSeg(wp, free) {
    const w = drag.w, k = drag.seg, P0 = drag.P0;
    let dx = wp[0] - drag.start[0], dy = wp[1] - drag.start[1];
    if (!free) {
      const a = P0[k], b = P0[k + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const nx = -(b[1] - a[1]) / l, ny = (b[0] - a[0]) / l;
      let s = dx * nx + dy * ny;
      if (Math.abs(nx) < 1e-6 || Math.abs(ny) < 1e-6) s = Math.round(s / GRID) * GRID;
      dx = nx * s; dy = ny * s;
    }
    w.pts = drag.pts0.map(p => p.slice());
    for (const j of [k - 1, k]) if (j >= 0 && j < w.pts.length) { w.pts[j][0] += dx; w.pts[j][1] += dy; }
  }
  function activatePending(wp) {
    const d = drag, w = d.w;
    if (!d.shift) selectOnlyWire(w); else { selW.add(w); syncUI(); }
    if (d.act === 'lane') { drag = { type: 'lane', w }; w.pin = true; w.dragX = wp[0]; }
    else if (d.act === 'point') { ensureManual(w); drag = { type: 'point', w, i: d.i }; }
    else if (d.act === 'seg') { drag = { type: 'seg', w, seg: d.seg, start: d.wp, P0: w.disp.map(p => p.slice()), pts0: w.pts.map(p => p.slice()) }; }
    else drag = { type: 'none', w };
    setCursor();
  }
  function endDrag() {
    if (!drag) return;
    if (drag.type === 'lane') { const w = drag.w; w.pin = false; if (w.kind === 'lane' && w.ft != null) w.manual = w.ft; }
    guides = []; drag = null; setCursor(); kick();
  }

  cv.addEventListener('pointerdown', e => {
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
    const sp = rel(e);
    pointers.set(e.pointerId, sp);
    viewAnim = null;
    if (pointers.size === 2) {
      endDrag();
      const [a, b] = [...pointers.values()];
      drag = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: view.s, m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, ox: view.ox, oy: view.oy };
      return;
    }
    if (pointers.size > 2) return;
    const wp = toWorld(sp);
    if (e.button === 1 || e.button === 2 || spaceDown) { drag = { type: 'pan', sx: sp.x, sy: sp.y, ox: view.ox, oy: view.oy }; setCursor(); kick(); return; }
    const hh = hitHandle(wp);
    if (hh) { drag = { type: 'pending', act: 'point', w: hh.w, i: hh.i, sp, wp, shift: e.shiftKey }; kick(); return; }
    const n = hitNode(wp);
    if (n) {
      if (e.shiftKey && selN.has(n)) { selN.delete(n); syncUI(); kick(); return; }
      if (e.shiftKey) selN.add(n);
      else if (!selN.has(n)) { selN.clear(); selW.clear(); selN.add(n); }
      toFront(n); syncUI();
      if (onTrack(n, wp)) { drag = { type: 'slider', n }; setSlider(n, wp[0]); }
      else startNodeDrag(n, wp);
      setCursor(); kick(); return;
    }
    const hit = hitWire(wp);
    if (hit) { drag = { type: 'pending', act: segAction(hit), w: hit.w, seg: hit.seg, sp, wp, shift: e.shiftKey }; kick(); return; }
    if (e.pointerType === 'touch') { drag = { type: 'pan', sx: sp.x, sy: sp.y, ox: view.ox, oy: view.oy }; return; }
    drag = { type: 'marquee', x0: wp[0], y0: wp[1], x1: wp[0], y1: wp[1], shift: e.shiftKey };
    setCursor(); kick();
  });
  cv.addEventListener('pointermove', e => {
    const sp = rel(e);
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, sp);
    if (!drag) { if (e.pointerType !== 'touch') updateHover(sp); return; }
    if (drag.type === 'pinch') {
      if (pointers.size < 2) return;
      const [a, b] = [...pointers.values()];
      const s = clamp(drag.s0 * Math.hypot(a.x - b.x, a.y - b.y) / drag.d0, 0.2, 2.5);
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const wx = (drag.m0.x - drag.ox) / drag.s0, wy = (drag.m0.y - drag.oy) / drag.s0;
      view.s = s; view.ox = m.x - wx * s; view.oy = m.y - wy * s;
      kick(); return;
    }
    if (drag.type === 'pan') { view.ox = drag.ox + sp.x - drag.sx; view.oy = drag.oy + sp.y - drag.sy; kick(); return; }
    const wp = toWorld(sp), free = !snapOn || e.altKey;
    if (drag.type === 'pending') {
      if (Math.hypot(sp.x - drag.sp.x, sp.y - drag.sp.y) < 4) return;
      activatePending(wp);
    }
    if (drag.type === 'slider') setSlider(drag.n, wp[0]);
    else if (drag.type === 'lane') drag.w.dragX = wp[0];
    else if (drag.type === 'point') movePoint(wp, free);
    else if (drag.type === 'seg') moveSeg(wp, free);
    else if (drag.type === 'node') moveNodes(wp, free);
    else if (drag.type === 'marquee') { drag.x1 = wp[0]; drag.y1 = wp[1]; }
    kick();
  });
  const up = e => {
    pointers.delete(e.pointerId);
    if (!drag) return;
    if (drag.type === 'pinch') { if (pointers.size < 2) drag = null; return; }
    if (drag.type === 'pending') {
      const w = drag.w;
      if (drag.shift) { if (selW.has(w)) selW.delete(w); else selW.add(w); syncUI(); }
      else selectOnlyWire(w);
      drag = null; setCursor(); kick(); return;
    }
    if (drag.type === 'marquee') {
      const d = drag;
      const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1), y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);
      if (!d.shift) { selN.clear(); selW.clear(); }
      if ((x1 - x0) * view.s > 4 || (y1 - y0) * view.s > 4) {
        for (const n of nodes) if (n.x >= x0 && n.x + n.w <= x1 && n.y >= y0 && n.y + n.h <= y1) selN.add(n);
      }
      syncUI();
    }
    endDrag();
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (!drag && hoverW) { hoverW = null; kick(); } });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('dblclick', e => {
    const wp = toWorld(rel(e));
    const hh = hitHandle(wp);
    if (hh) {
      ensureManual(hh.w); hh.w.pts.splice(hh.i, 1); selectOnlyWire(hh.w);
      toast('已删除拐点'); kick(); return;
    }
    if (hitNode(wp)) return;
    const hit = hitWire(wp);
    if (!hit || !editable(hit.w)) return;
    const w = hit.w;
    ensureManual(w);
    const P = [[w.ax, w.ay], ...w.pts, [w.bx, w.by]];
    let k = 0, bd = Infinity;
    for (let i = 0; i < P.length - 1; i++) { const d = segDist(wp, P[i], P[i + 1]); if (d < bd) { bd = d; k = i; } }
    const a = P[k], b = P[k + 1], dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    const t = l2 ? clamp(((wp[0] - a[0]) * dx + (wp[1] - a[1]) * dy) / l2, 0, 1) : 0;
    w.pts.splice(k, 0, [a[0] + dx * t, a[1] + dy * t]);
    selectOnlyWire(w);
    toast('已加拐点，拖动它改走线'); kick();
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const sp = rel(e);
    const mouseWheel = e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
    if (e.ctrlKey || e.metaKey) zoomAt(sp, Math.exp(-e.deltaY * 0.01));
    else if (mouseWheel) zoomAt(sp, Math.exp(-Math.sign(e.deltaY) * 0.15));
    else { view.ox -= e.deltaX; view.oy -= e.deltaY; viewAnim = null; kick(); }
  }, { passive: false });

  // ---------- controls ----------
  segBtns.forEach(b => b.addEventListener('click', () => applyStyle(b.dataset.mode)));
  const spIn = $('sp'), spOut = $('spv');
  spIn.addEventListener('input', () => { SP = +spIn.value; spOut.value = SP; kick(); });
  $('snap').addEventListener('change', e => { snapOn = e.target.checked; });
  $('tidy').addEventListener('click', tidy);
  $('scramble').addEventListener('click', scramble);
  $('fitb').addEventListener('click', () => fit(true, false));
  $('zin').addEventListener('click', () => zoomAt({ x: W / 2, y: H / 2 }, 1.25));
  $('zout').addEventListener('click', () => zoomAt({ x: W / 2, y: H / 2 }, 0.8));
  $('selreset').addEventListener('click', resetSelected);
  $('selclear').addEventListener('click', clearSel);
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey) return;
    const tag = e.target && e.target.tagName;
    if (e.key === ' ') {
      if (tag === 'BUTTON' || tag === 'INPUT') return;
      spaceDown = true; if (!drag) cv.style.cursor = 'grab'; e.preventDefault(); return;
    }
    if (e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '1') applyStyle('bezier');
    else if (k === '2') applyStyle('ortho');
    else if (k === '3') applyStyle('diag');
    else if (k === 't') tidy();
    else if (k === 'r') scramble();
    else if (k === 'f') fit(true, false);
    else if (k === '=' || k === '+') zoomAt({ x: W / 2, y: H / 2 }, 1.2);
    else if (k === '-') zoomAt({ x: W / 2, y: H / 2 }, 1 / 1.2);
    else if (k === 'escape') clearSel();
    else if (k === 'delete' || k === 'backspace') { if (tag === 'INPUT') return; resetSelected(); }
    else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; setCursor(); } });
  window.addEventListener('blur', () => { spaceDown = false; });

  function onTheme() { readTokens(); kick(); }
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  readTokens();
  new ResizeObserver(resize).observe(stage);
  resize();
  syncUI();
  if (document.fonts) {
    Promise.all([
      document.fonts.load('600 11px "IBM Plex Sans Condensed"'),
      document.fonts.load('500 11px "IBM Plex Sans Condensed"'),
      document.fonts.load('500 10px "IBM Plex Mono"')
    ]).then(kick, kick);
  }
  // Open on the messy native wires, then straighten them once so the effect is visible right away.
  setTimeout(() => { if (globalMode === 'bezier' && !drag) setGlobal('diag', '45° 走线 · 按 1 / 2 / 3 切换样式'); }, 1100);
})();
</script>
